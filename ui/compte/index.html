<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Compte · SelixyCARD</title>
  <link rel="preload" href="/images/fonds/fond-compte.webp?v=4" as="image" type="image/webp" fetchpriority="high">
  <style>
    html, body {
      margin: 0;
      background-color: #1a1e22;
      background-image: url('/images/fonds/fond-compte.webp?v=4');
      background-position: center center;
      background-size: auto 100%;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    @media (max-width: 700px) {
      body { background-image: url('/images/fonds/fond-compte-mobile.webp?v=4'); }
    }
  </style>
  <link rel="preload" href="/polices/caveat-brush-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Caveat+Brush&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="../css/atelier/jetons.css">
  <link rel="stylesheet" href="../css/atelier/transitions.css">
  <link rel="stylesheet" href="../css/atelier/papier.css">
  <link rel="stylesheet" href="../css/atelier/formulaires.css">
  <link rel="stylesheet" href="../css/atelier/entete.css">
  <link rel="stylesheet" href="../css/atelier/sombre.css">
  <link rel="stylesheet" href="../css/compte.css">
  <link rel="preload" href="/wasm/moteur_bg.wasm?v=glow3" as="fetch" type="application/wasm" crossorigin>
</head>
<body data-decor="compte">
  <canvas id="decor" aria-hidden="true"></canvas>
  <header class="header">
    <a class="tab" href="/">Accueil</a>
  </header>
  <main>
    <section class="card compte-fiche" id="connecte" hidden>
      <p class="etiquette">Fiche d'illustratrice</p>
      <h1>Bonjour <span id="pseudo" class="souligne"></span></h1>
      <p class="hint">Vous êtes connecté : vos sets vous attendent sur la table de travail.</p>
      <div class="rangee">
        <a class="button button--primary" href="/cartes/">Mes cartes</a>
        <button class="button" id="deconnexion" type="button">Se déconnecter</button>
      </div>
    </section>
    <section class="card compte-fiche" id="anonyme" hidden>
      <p class="etiquette">Fiche d'illustratrice</p>
      <h1 id="titre">Connexion</h1>
      <form id="formulaire">
        <p class="error" id="erreur" role="alert" hidden></p>
        <div class="field"><label for="pseudo-saisi">Pseudo</label><input id="pseudo-saisi" name="pseudo" autocomplete="username" required></div>
        <div class="field"><label for="mdp">Mot de passe</label><input id="mdp" name="mot_de_passe" type="password" autocomplete="current-password" required></div>
        <button class="button button--primary" type="submit" id="valider">Se connecter</button>
      </form>
      <p class="hint compte-bascule"><span id="invite">Pas de compte ?</span> <a href="#" id="basculer">Créer un compte</a></p>
    </section>
  </main>
  <script type="module" src="../js/compte/principal.js"></script>
  <script type="module" src="../js/decor/page.js"></script>
</body>
</html>
